name: Publish Posts to Ghost

on:
  workflow_dispatch:
    inputs:
      post_file:
        description: 'Post filename to publish (e.g., nextcloud-mcp-ai-automation.md)'
        required: false
        default: ''
      publish_all:
        description: 'Publish ALL posts from content/posts/'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyjwt

      - name: Create .env file from Secrets
        run: |
          # Use printf to strip trailing newlines
          API_URL=$(printf '%s' "${{ secrets.GHOST_API_URL }}")
          API_KEY=$(printf '%s' "${{ secrets.GHOST_ADMIN_API_KEY }}")
          echo "GHOST_API_URL=$API_URL" > .env
          echo "GHOST_ADMIN_API_KEY=$API_KEY" >> .env
          echo "GHOST_API_VERSION=v5.0" >> .env

      - name: Publish single post
        if: github.event.inputs.post_file != ''
        env:
          POST_FILE: ${{ github.event.inputs.post_file }}
        run: |
          python scripts/publish_all_posts.py

      - name: Publish all posts
        if: github.event.inputs.post_file == '' && github.event.inputs.publish_all == 'true'
        run: |
          python scripts/publish_all_posts.py