name: Ghost Blog Management

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Script to run (e.g., restart_ghost.py, diagnose_ghost.py)'
        required: true
        default: 'restart_ghost.py'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file from Secrets
        run: |
          # This step creates the .env file that your scripts expect.
          # It maps GitHub Secrets to the .env file format.
          echo "VPS_IP=${{ secrets.VPS_IP }}" >> .env
          echo "VPS_USER=${{ secrets.VPS_USER }}" >> .env
          echo "VPS_PW=${{ secrets.VPS_PW }}" >> .env
          echo "BLOG_DOMAIN=${{ secrets.BLOG_DOMAIN }}" >> .env
          echo "BLOG_URL=${{ secrets.BLOG_URL }}" >> .env
          echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" >> .env
          echo "GHOST_API_URL=${{ secrets.GHOST_API_URL }}" >> .env
          echo "GHOST_ADMIN_API_KEY=${{ secrets.GHOST_ADMIN_API_KEY }}" >> .env
          echo "GHOST_CONTENT_API_KEY=${{ secrets.GHOST_CONTENT_API_KEY }}" >> .env
          # GHOST_API_VERSION is a Repository Variable, not a Secret
          echo "GHOST_API_VERSION=${{ vars.GHOST_API_VERSION }}" >> .env
          
          # Database - MYSQL_DATABASE_NAME is required by scripts!
          echo "MySQL_database_name=${{ secrets.MYSQL_DATABASE_NAME }}" >> .env
          echo "MySQL_username=${{ secrets.MYSQL_USERNAME }}" >> .env
          echo "MySQL_password=${{ secrets.MYSQL_PASSWORD }}" >> .env
          echo "MySQL_hostname=${{ secrets.MYSQL_HOSTNAME }}" >> .env

      - name: Run Script
        run: |
          SCRIPT_NAME="${{ inputs.script }}"
          if [ -z "$SCRIPT_NAME" ]; then
            SCRIPT_NAME="restart_ghost.py"
          fi
          echo "Running $SCRIPT_NAME..."
          python "$SCRIPT_NAME"
