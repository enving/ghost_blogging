name: Fix Ghost CSS - Complete Restart

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'safe-ghost-restart-paramiko.py'
      - '.github/workflows/fix-ghost-css.yml'

jobs:
  fix-ghost-css:
    runs-on: ubuntu-latest
    name: Fix Ghost CSS by complete restart
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install paramiko

      - name: Fix Ghost CSS
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PW: ${{ secrets.VPS_PW }}
        run: |
          python safe-ghost-restart-paramiko.py