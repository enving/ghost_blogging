# n8n neben Ghost auf dem IONOS-VPS.
# Liegt auf dem Server unter /opt/n8n. Secrets stehen nur in /opt/n8n/.env (nie im Repo).
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    container_name: n8n
    restart: unless-stopped
    # Nur lokal erreichbar – nach außen geht es ausschließlich über nginx + TLS.
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_DOMAIN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      # Öffentliche URL: daraus baut n8n Webhook- und OAuth-Callback-URLs.
      - WEBHOOK_URL=https://${N8N_DOMAIN}/
      - N8N_EDITOR_BASE_URL=https://${N8N_DOMAIN}/
      - N8N_PROXY_HOPS=1
      - N8N_SECURE_COOKIE=true
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      # Alte Ausführungen automatisch löschen, damit die SQLite-DB nicht vollläuft.
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
    volumes:
      - n8n_data:/home/node/.n8n
    mem_limit: 1g

volumes:
  n8n_data:
