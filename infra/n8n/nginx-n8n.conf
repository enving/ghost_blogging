# nginx-vHost für n8n. setup.sh schreibt ihn bei jedem Lauf nach /etc/nginx/sites-available/n8n
# und ersetzt DOMAIN_PLACEHOLDER und SSL_SNIPPET_PLACEHOLDER.
#
# Wichtig: n8n teilt sich Port 443 mit Ghost. Die TLS-Einstellungen müssen identisch mit
# Ghosts Snippet sein – sonst wählt der Server nach einem HelloRetryRequest (SNI-Wechsel)
# eine andere Cipher-Suite und Firefox/Safari brechen mit "illegal parameter" ab.
# Deshalb certbot nur mit "certonly" – er soll diese Datei nicht umschreiben.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name DOMAIN_PLACEHOLDER;

    ssl_certificate /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
    include SSL_SNIPPET_PLACEHOLDER;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;

        # WebSockets für den Editor
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Lange Workflows / Server-Sent Events
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
